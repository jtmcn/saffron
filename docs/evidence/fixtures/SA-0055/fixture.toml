# the same diff: sharing one readiness check's pinned base between `saffron
# batch`'s scan and its own preflight.
#
# Provenance, all four inputs frozen rather than rebuilt per pass:
#   diff.patch      git diff aa8dfd1..e5a7cbe, asserted byte-identical to the
#                   recorded ~/.saffron/batches/v0/SA-0055/patch.diff
#   spec_body.md    the spec at base, plus context.criteria_section, the way
#                   session.py's REVIEW call assembles it (`spec_body=`).
#   gates.txt       review.gate_summary over the ledger's gate_results rows,
#                   tools spliced back in from the same run's baseline.json.
#   context.md      CONTEXT.md at base.

spec_id = "SA-0055"
pr = 131
base_sha = "aa8dfd17e4ce13a20bbeb950e74bb459020ce746"
head_sha = "e5a7cbe930e9b0f3e34e335094cb328a17d61655"
source = "docs/BACKLOG.md item 69: `pinned=derived` invisible to an assertion matching only `ast.Constant`"

