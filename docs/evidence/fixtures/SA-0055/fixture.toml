[[defects]]
id = "pinned-base-unwitnessed"
locations = [{ file = "saffron/cli.py", lines = [685, 730] }]
owner = "adequacy"
min_severity = "blocker"
# `_resolve_queue`'s `if pinned is not None: ... else: <derive>` branch is
# what lets `saffron batch` skip re-deriving a mirror, remote and base sha it
# already paid for in readiness. `test_cli.py`'s own AST helper,
# `_source_calls(..., keyword="pinned")`, only recognises a keyword whose
# value is `isinstance(kw.value, ast.Constant)` — a literal — so it cannot
# see a call passing `pinned=<some name>`, only `pinned=None` or a bare
# omission. A caller that starts forwarding a *wrong* derived `PinnedBase`
# (not `None`, not omitted, just mistaken) passes this check identically to
# a correct one; the check can tell "a literal" from "not a literal", never
# "the right value" from "the wrong one". LOW CONFIDENCE: I read this as the
# mechanism the backlog row names, but did not run the mutation myself to
# confirm which specific line it survives against.
must_mention = ["ast.Constant", "keyword", "not a literal"]

[[defects]]
id = "readiness-guard-unwitnessed"
locations = [{ file = "saffron/cli.py", lines = [930, 950] }]
owner = "adequacy"
min_severity = "blocker"
# `if readiness.ok:` gates the whole scan-and-run branch; deleting it leaves
# the three narrowing asserts (`readiness.mirror is not None`, etc.)
# unconditional. On a failing readiness those fields are `None`, so the
# asserts raise — an uncaught `AssertionError`, which `main()`'s own
# top-level `except Exception` turns into exit 2, the same code the guarded
# path already returns for a readiness failure (`INFRASTRUCTURE`). No test
# distinguishes "refused cleanly" from "crashed into the same exit code", so
# both versions of this function pass every test in the suite.
must_mention = ["readiness", "guard", "exit 2"]
