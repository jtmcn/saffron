[[defects]]
id = "breaker-reset-unguarded"
file = "saffron/batch.py"
lines = [130, 190]
owner = "adequacy"
min_severity = "blocker"
# `run_batch`'s per-candidate loop resets `consecutive_aborts = 0` in the
# `else` branch of `if outcome.state in ABORT_STATES:` (line 187) — the whole
# reason the breaker can recover from an isolated blip rather than tripping
# on any two aborts over a long night. No test in the suite drives three
# candidates where the middle one succeeds and the third would only pass with
# the counter cleared, so deleting the reset left every test green. Range is
# the whole loop body: the reset's meaning depends on the threshold check and
# both `+= 1` sites around it.
must_mention = ["reset", "consecutive", "breaker"]
