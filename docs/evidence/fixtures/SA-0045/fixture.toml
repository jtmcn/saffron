# The two migration tests build `before = SCHEMA.replace(<exact line>, "")`
# and then self-check with `assert <same exact substring> not in before`.
# Both checks share one hardcoded literal, so reflowing the real `batch_id`
# column's line in `ledger.py` (collapsed whitespace, wrapped differently)
# makes `.replace()` a silent no-op *and* the self-check pass anyway — the
# same stale text fails to match either place, so neither notices `before`
# never had the column removed. The range covers both tests plus the
# constructed `before` string between them; the mutation named in item 69's
# row is exactly this reflow, and it left the suite green.
must_mention = ["replace", "whitespace", "reflow"]
