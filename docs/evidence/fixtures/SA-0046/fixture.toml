# plus the same self-check shape as SA-0045's pair — `assert "    policy_sha
# TEXT,\n" not in before`, one hardcoded literal read twice. Reflowing the
# real `policy_sha TEXT,` line in `ledger.py` makes the `.replace()` a no-op
