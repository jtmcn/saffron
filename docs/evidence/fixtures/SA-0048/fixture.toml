# PR #117 (`SA-0048`), one of item 69's nine known-bad tests, found by
# mutating `validate_claude_token`'s refusal codes.
#
# `base` is not this task's own git parent's ancestor in the ordinary sense —
# it *is* the parent (`SA-0046`'s head, per item 33: this queue stacked
# `SA-0048` directly on `SA-0046` rather than on main). The spec file itself
# never lands in that tree at all: `SA-0048`'s spec was revised on main
# (`c5b8838`, "L3 returned REVISE") between `SA-0046`'s head and this task's
# run, so `recover_fixture` reads it off the latest commit that touched the
# path before this head was authored, not off `base`'s own tree — the same
# thing `saffron cell <path>` did, reading the file live off disk rather than
# off the branch it built the diff on top of.
#
# Provenance, all four inputs frozen rather than rebuilt per pass:
#   diff.patch      git diff c71eeca..64c7161, asserted byte-identical to the
#                   recorded ~/.saffron/batches/v0/SA-0048/patch.diff
#   spec_body.md    the spec as revised on main at c5b8838 (see above), plus
#                   context.criteria_section, the way session.py's REVIEW
#                   call assembles it (`spec_body=`).
#   gates.txt       review.gate_summary over the ledger's gate_results rows,
#                   tools spliced back in from the same run's baseline.json.
#   context.md      CONTEXT.md at base.

spec_id = "SA-0048"
pr = 117
