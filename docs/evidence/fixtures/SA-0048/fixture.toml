[[defects]]
id = "refusal-codes-unpinned"
locations = [{ file = "saffron/preflight.py", lines = [295, 320] }]
owner = "adequacy"
min_severity = "blocker"
# `validate_claude_token`'s `except urllib.error.HTTPError as exc: return
# exc.code not in (401, 403)` is the one line the tuple lives on, but no test
# reaches it with a real `HTTPError` — `test_the_token_probes_default_
# request_shape_is_asserted_not_sent` (the one test that exercises the
# default `urlopen`) raises `URLError`, not `HTTPError`, so the tuple's
# membership is asserted by nothing. Mutating it to `(999,)` moved no test.
# Range is the whole function so a claim landing on the docstring's own "401
# or 403" wording still counts as having found it.
must_mention = ["401", "403", "status code"]
