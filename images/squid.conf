# Hostname CONNECT allowlist. Hostnames, not IPs: api.anthropic.com is behind a
# CDN, so an IP allowlist resolved at startup starts failing mid-batch (§5.1).
http_port 3128
# The container runs as the squid user directly (never root), so the pid
# file goes where that user can write — /run is root-owned.
pid_filename /var/cache/squid/squid.pid

acl allowed_hosts dstdomain api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowed_hosts
http_access deny all

# A cell must not learn anything from the proxy's own behaviour.
forwarded_for delete
via off
httpd_suppress_version_string on

cache deny all
access_log stdio:/dev/stdout
