repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Local, not an upstream rev: the `types` gate parses ty's output, so the hook
  # and the gate must run the one version `pyproject.toml` pins.
  - repo: local
    hooks:
      - id: ty
        name: ty (the types gate's checker)
        language: system
        entry: uv run ty check
        pass_filenames: false
        # ty's own configuration lives in pyproject.toml, so a change there
        # must trigger the hook that reads it.
        files: ^(.*\.py|pyproject\.toml)$

  # Local for ty's reason: the `structure` gate parses ast-grep's JSON, and the
  # rule syntax is pre-1.0, so the hook runs the one version `pyproject.toml`
  # pins. The gate takes whatever `ast-grep` is on PATH and reports the version
  # it ran, exactly as `lint` takes `ruff`, so host skew is visible, not absent.
  # `test` before `scan`: a rule whose own invalid snippet no longer matches is
  # a rule that has stopped guarding anything, and it would otherwise report a
  # clean scan. The flags are the gate's, for the gate's reasons — see
  # `.saffron/gates/structure.py`; a hook that scanned a different set of files
  # than the gate would disagree with it at exactly the wrong moment.
  - repo: local
    hooks:
      - id: ast-grep
        name: ast-grep (the structure gate's rules)
        language: system
        entry: >-
          sh -c 'uv run ast-grep test -c .saffron/sgconfig.yml
          && uv run ast-grep scan -c .saffron/sgconfig.yml
          --no-ignore hidden --no-ignore dot --no-ignore exclude
          --no-ignore global --no-ignore vcs
          --globs "!.venv/**" --globs "!.claude/worktrees/**"
          --globs "!**/__pycache__/**"'
        pass_filenames: false
        files: ^(.*\.py|\.saffron/(sgconfig\.yml|rules/.*|rule-tests/.*))$

  # A retired term, not the whole `_Avoid_` list: most of those words are ordinary
  # English elsewhere. Only a word a settled decision killed outright is decidable
  # by grep. The excluded paths all state the vocabulary rules and so must quote
  # the word they forbid — the plans included, which open by listing them.
  - repo: local
    hooks:
      - id: retired-vocabulary
        name: retired vocabulary (CONTEXT.md § settled naming decisions)
        language: pygrep
        types: [text]
        # The class is a space or a hyphen — both forms were live — and it is
        # also what stops this line matching itself. `gate-runner` is safe: the
        # boundary after `run` fails on the `n`.
        entry: '(?i)gate[ -]runs?\b'
        exclude: '^(CONTEXT\.md|CLAUDE\.md|docs/superpowers/|docs/evidence/)'
