id: skip-is-spelled-in-full
# Every legitimate shape in the tree today: tests/conftest.py, tests/test_policy.py,
# tests/test_runtime.py, tests/test_package_cell.py and tests/test_report.py.
# `integrity` reads these.
valid:
  - 'pytest.skip("no working container found on this host")'
  - 'pytest.skip(reason="root reads everything")'
  - |
    @pytest.mark.skip
    def test_a():
        pass
  - |
    @pytest.mark.skipif(os.geteuid() == 0, reason="root ignores file permission bits")
    def test_a():
        pass
  - |
    with pytest.raises(pytest.skip.Exception) as excinfo:
        pytest_runtest_setup(item)
  - |
    with pytest.raises(pytest.skip.Exception):
        pytest_runtest_setup(item)
  - 'pytestmark = pytest.mark.cell'
  - 'def test_a(monkeypatch: pytest.MonkeyPatch): pass'
  - 'from pytest import raises'
  - 'import pytest'
  - 'from unittest import mock'
  # unittest's skip spelled in full is the token's to read, not this rule's.
  - |
    @unittest.skip("no")
    def test_a():
        pass
  - 'item.add_marker("cell")'
  - 'item.add_marker(pytest.mark.cell)'
invalid:
  # SA-0077's own move (PR #232).
  - '_skip = pytest.skip'
  - 'run(pytest.skip, "passed as a value")'
  - 'raise pytest.skip.Exception("no")'
  - 'pytestmark = pytest.mark.skip'
  - 'pytestmark = pytest.mark.skip(reason="no")'
  - 'pytest.param(1, marks=pytest.mark.skipif(True, reason="no"))'
  - 'mark = pytest.mark'
  - 'from pytest import skip'
  - 'from pytest import skip as _skip'
  - 'from pytest import mark'
  - 'from _pytest.outcomes import skip'
  - 'import _pytest.outcomes'
  - 'import pytest as pt'
  - 'from pytest import *'
  # The module itself as a value, which reaches every name on it unspelled.
  - '_P = pytest'
  - 'getattr(pytest, "skip")("no")'
  # The raises allowance, read too loosely: the call kept, or not pytest's.
  - '_B = pytest.raises(pytest.skip.Exception).expected_exceptions'
  - '_C = raises(pytest.skip.Exception)'
  # unittest's, which pytest honours on a plain function too.
  - 'from unittest import skip'
  - 'from unittest import skipIf as _s'
  - 'from unittest.case import skipUnless'
  - 'from unittest import *'
  - 'import unittest as ut'
  - '_U = unittest'
  # The marker named by string, which no token can read: "skip" is a gate status.
  - 'item.add_marker("skip")'
  - "item.add_marker('skipif')"
  - 'item.add_marker(marker="skip")'
