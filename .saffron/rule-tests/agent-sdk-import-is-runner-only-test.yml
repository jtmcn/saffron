id: agent-sdk-import-is-runner-only
valid:
  - 'import json'
  - 'from pathlib import Path'
  # The module named as data, which is how tests/test_image.py asserts the base
  # image has it. Naming the SDK is fine; importing it here is not.
  - 'run_in_cell(image, ["python", "-c", "import claude_agent_sdk"])'
  - 'note = "claude_agent_sdk lives in the cell"'
  - 'importlib.import_module("json")'
  - 'importlib.import_module(name="json")'
invalid:
  - 'import claude_agent_sdk'
  - 'from claude_agent_sdk import ClaudeAgentOptions, query'
  - 'import claude_agent_sdk as sdk'
  # An import the statement kinds above cannot see, because it is a call.
  - 'importlib.import_module("claude_agent_sdk")'
  - '__import__("claude_agent_sdk")'
  # Both quote styles. Measured: with the regex anchored on a literal `"`, this
  # walked past while the double-quoted twin above was caught.
  - "importlib.import_module('claude_agent_sdk')"
  # The prefix. A `string` node's text carries `r`/`f`/`b` as well as its quotes,
  # so anchoring on the quote read only the spellings its author typed — and ruff
  # neither lints nor reformats a raw string, so nothing else caught this either.
  - 'importlib.import_module(r"claude_agent_sdk")'
  - '__import__(r"claude_agent_sdk")'
  # The parameter called by its name rather than by position — the shape
  # `nthChild: 1` cannot see, and the one the other two rules already close.
  - 'importlib.import_module(name="claude_agent_sdk")'
