id: container-runtime-is-runtime-only
valid:
  - 'subprocess.run([RUNTIME, "run", "--rm", image])'
  - 'subprocess.run(["git", "status"])'
  - '_run_argv([RUNTIME, "exec", "-i", name])'
  # A mention is not a call. Both of these are live in the tree and must stay.
  - 'note = "apple/container routes the default gateway"'
  - 'd = {"container": "not an argv"}'
  # session.py:1797, pinned. A tuple whose first element labels what was removed,
  # inside a list — data, not an argv. It is what stops the tuple branch below
  # from being written as the one-liner it looks like.
  - 'removed = [("container", name, runtime.remove_container(name))]'
invalid:
  - 'subprocess.run(["container", "run", "--rm", image])'
  - 'subprocess.Popen(["container", "exec", "-i", name])'
  - 'argv = ["container"]'
  # The binary spelled as a path is the same argv.
  - 'subprocess.run(["/usr/local/bin/container", "run", "--rm", image])'
  # A tuple is an argv too, when it is not an element of a list.
  - 'subprocess.run(("container", "run", "--rm", image))'
  - 'argv = ("container", "run")'
  # Naming the binary once and calling through the local: what the rule's own
  # note ("call through RUNTIME") invites, and what every branch above missed.
  - 'RT = "container"'
  - 'self.runtime = "container"'
  # Both quote styles, one per branch. Measured: with the regexes anchored on a
  # literal `"`, every one of these walked past while its double-quoted twin
  # above was caught — the rule caught the spellings its author happened to type.
  - "subprocess.run(['container', 'run', '--rm', image])"
  - "argv = ('container', 'run')"
  - "RT = 'container'"
  # A name binds to the binary without an assignment in sight. `session.py` calls
  # its helpers by keyword throughout, so the first is what a refactor reaches for.
  - 'start(runtime="container")'
  - 'def start(binary="container"): pass'
  - 'RUNTIMES = {"apple": "container"}'
