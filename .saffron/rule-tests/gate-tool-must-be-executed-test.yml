id: gate-tool-must-be-executed
valid:
  - 'emit({"gate": "lint", "tool": tool})'
  - 'emit({"gate": "lint", "tool": version.stdout.strip()})'
  - 'payload["tool"] = tool'
  - 'tool = version.stdout.strip()'
  - 'tool = reported[0].strip() if reported else ""'
  - 'toolchain = "uv 0.4.0"'
  - 'GateResult(gate="lint", status="pass", tool=tool)'
  - 'GateResult(gate="tests", tool=tests_result.tool)'
  - 'result.tool = version.stdout.strip()'
  - 'payload.setdefault("tool", tool)'
  # Near misses: a different field whose name merely starts the same way.
  - 'emit({"toolchain": "uv 0.4.0"})'
  - 'Config(tools="ruff")'
  - 'options.setdefault("toolchain", "uv 0.4.0")'
  # The declaration is a type, not a value.
  - |
    class GateResult:
        tool: str | None = None
invalid:
  - 'emit({"gate": "lint", "tool": "ruff 0.16.3"})'
  - 'payload["tool"] = "ruff 0.16.3"'
  - 'GateResult(gate="lint", status="pass", tool="ruff 0.16.3")'
  - 'tool = "ruff 0.16.3"'
  # The attribute form, which a mutable `GateResult` is what invites.
  - 'result.tool = "ruff 0.16.3"'
  # Writing the field without ever spelling an assignment to it.
  - 'payload.setdefault("tool", "ruff 0.16.3")'
  # Both quote styles, one per branch that matches on the key's text. Measured:
  # with the regexes anchored on a literal `"`, these three walked past.
  - "emit({'gate': 'lint', 'tool': 'ruff 0.16.3'})"
  - "payload['tool'] = 'ruff 0.16.3'"
  - "payload.setdefault('tool', 'ruff 0.16.3')"
  # A default is neither an assignment nor a keyword argument, so every other
  # branch missed it — and it is a plausible way to write it in a gate helper.
  - 'def emit(payload, tool="ruff 0.16.3"): pass'
