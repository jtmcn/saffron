# Saffron as a target repo. Everything here is repo-shaped; none of it is code.
gates:
  format: { blocking: true }
  lint:   { blocking: true }
  types:  { blocking: true }
  tests:  { blocking: true }

# Where a plausible-looking wrong change hurts most. Getting this right is most
# of what onboarding actually means (DESIGN.md §5.6).
elevate_on:
  - saffron/gates/**
  - saffron/cell/**
  - saffron/ledger.py

protected:
  - DESIGN.md
  - CONTEXT.md
  - .saffron/**
  - uv.lock

integrity:
  test_paths: ["tests/**"]
  # The call form, not just the decorator: `pytest.skip("x")` as a test's first
  # statement left `tests`, `census` and `integrity` all green. Measured: it
  # costs zero extra failures against this branch's own diff, where the
  # decorator tokens already cost 64. `pytest.xfail(` needs no entry — the bare
  # `xfail` token already matches it.
  suppressions:
    ["@pytest.mark.skip", "pytest.skip(", "xfail", "# type: ignore", "# noqa"]
  gate_config: ["pyproject.toml", ".saffron/**"]

thread_env: {}
