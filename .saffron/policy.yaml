# Saffron as a target repo. Everything here is repo-shaped; none of it is code.
gates:
  format: { blocking: true }
  lint:   { blocking: true }
  types:  { blocking: true }
  tests:  { blocking: true }
  # Repo-defined, against a surface an agent cannot satisfy by writing plausible
  # code: the shapes either accept the graph or they do not (§5.4). Declared
  # unconditionally rather than `when: "**/*.ttl"` — `GateDeclaration.when` is
  # parsed and nothing reads it, and a control that reads as present and is not
  # is the founding defect of Appendix I. Validation is milliseconds.
  shacl:  { blocking: true }
  # Invariants that were prose in CLAUDE.md and enforced by nothing: which module
  # may name the cell runtime, which file may import the Agent SDK, and that a
  # gate's `tool` field is executed rather than written (Appendix G, §2.1, §5.4).
  # Structural, not textual — each has a legitimate textual near-miss in the tree,
  # so the `retired-vocabulary` pygrep hook's approach would false-positive on all
  # three. Declared unconditionally, for the reason `shacl` gives above.
  structure: { blocking: true }

# Where a plausible-looking wrong change hurts most. Getting this right is most
# of what onboarding actually means (DESIGN.md §5.6).
elevate_on:
  - saffron/gates/**
  - saffron/cell/**
  - saffron/ledger.py
  # The rules are the `structure` gate's substance, so a diff touching one is at
  # least as worth a person's eye as one touching a gate's executable. `protected`
  # does not reach them: `.saffron/**` is a glob, and `protected_touch_refusal`
  # skips glob entries as undecidable — its own `ponytail:` note says so.
  - .saffron/rules/**
  # The tests are as load-bearing as the rules, which is not obvious. Measured:
  # delete a rule's `invalid:` list and neuter its body, and `ast-grep test`
  # reports `3 passed; 0 failed` — a rule matching nothing satisfies every `valid`
  # snippet that remains — so the gate certifies it and reports `pass` on a tree
  # carrying the violation. The snippets are what prove a rule fires at all.
  - .saffron/rule-tests/**
  # The scorer decides whether a lens change looks better, and its predicate is
  # authored from the runs it grades — the tuning risk `calibrate` exists for and
  # does not fully cover. A diff that widens a line range is a diff that moves a
  # published number.
  - harness/**

protected:
  - DESIGN.md
  - CONTEXT.md
  - .saffron/**
  - uv.lock

integrity:
  test_paths: ["tests/**"]
  # The call form of pytest's skip, not just its decorator: as a test's first
  # statement it left `tests`, `census` and `integrity` all green. Not free, as
  # an earlier note here claimed: the tokens this list declares are themselves
  # scanned, so the list below accounts for 6 of the 70 `added-suppression`
  # failures this branch's diff reports. Describe a token, never quote one.
  # pytest's expected-failure marker needs one entry, not two: the bare form
  # in the list already matches the call form as well.
  # ty honours its own ignore comment as well as the checker-agnostic one, and
  # the `types` gate is blocking — a suppression syntax this list cannot see is
  # the hole `integrity` exists to close. The bare form matches the
  # rule-scoped form too, as with the expected-failure marker above.
  suppressions:
    [
      "@pytest.mark.skip",
      "pytest.skip(",
      "xfail",
      "# type: ignore",
      "# ty: ignore",
      "# noqa",
    ]
  # Collection runs in the repo's own Python, so `census` cannot see a conftest
  # that hides a test from the runner. This routes the edit to a person.
  # ruff.toml/.ruff.toml take precedence over pyproject.toml's [tool.ruff] and
  # can silence lint/format outright — same family, routed the same way.
  # `**/pyproject.toml`, not the bare name: measured, a *nested* pyproject.toml
  # carrying [tool.ruff] exclude silences ruff over that subtree exactly as a
  # dropped ruff.toml does. `**/` matches zero directories, so root is covered.
  # `ontology/shapes/**` is the `shacl` gate's whole constraint surface, and the
  # gate is blocking: an agent that cannot satisfy a shape can otherwise relax an
  # `sh:in`, drop an `sh:property`, or delete a shape and its paired fixture, and
  # go green. Same argument as `conftest.py` two lines down — the rules a gate
  # enforces have to be routed to a person, not just the gate's own executable.
  # `.gitignore` decides which files ruff can see at all. Measured: it walks with
  # a gitignore filter that has no notion of what git tracks, so one line naming a
  # *tracked* file removes it from `lint` and `format` while it stays in the diff
  # and in the commit. Nested ones count, hence `**/`. This routes the edit to a
  # person, which is the tracked half only — a `.gitignore` naming itself is never
  # added and so reaches no diff. `structure` no longer needs this entry at all:
  # it refuses every ignore source and states its own file set with `--globs`.
  # Doing the same for ruff, and so for `lint` and `format`, is backlog item 76.
  gate_config:
    [
      "ontology/shapes/**",
      "ontology/*.py",
      "**/pyproject.toml",
      ".saffron/**",
      "**/conftest.py",
      "**/ruff.toml",
      "**/.ruff.toml",
      "**/.gitignore",
    ]

thread_env: {}
