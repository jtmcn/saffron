id: pytest-skip-is-spelled-in-full
language: python
severity: error
message: spell pytest's skip in full where it is used, or `integrity` cannot read it
note: |
  Backlog item 112. `integrity` matches `.saffron/policy.yaml`'s suppression
  tokens as text, so a skip bound to a name, imported by name, or reached through
  a renamed module spells none of them, and every later call passes. SA-0077 did
  exactly this, with a comment saying why. Call pytest's skip directly, or
  decorate with the marker, where the scan reads it.

# No `files:` scope: an alias bound in a helper outside tests/ is the same hole.
# The expected-failure marker is absent on purpose — its token is the bare word,
# which every spelling of it carries, the binding line included.
# ponytail: `getattr` on a computed name, or the module itself bound to a plain
# name, is past any structural rule; closing those means a reader of what a name
# resolves to, not of its shape.
rule:
  any:
    # `pytest.skip` anywhere but the callee of a call.
    - kind: attribute
      regex: '^pytest\.skip$'
      not:
        any:
          - inside: { kind: call, field: function }
          # `pytest.raises(pytest.skip.Exception)` asserts that a skip happened.
          - inside:
              kind: attribute
              has: { field: attribute, regex: '^Exception$' }
              inside:
                kind: argument_list
                inside:
                  kind: call
                  has: { field: function, regex: '(^|\.)raises$' }
    # The markers anywhere but a decorator, bare or called — `marks=` in a
    # `pytest.param` and a module's `pytestmark` spell no `@`.
    - kind: attribute
      regex: '^pytest\.mark\.skip(if)?$'
      not:
        any:
          - inside: { kind: decorator }
          - inside: { kind: call, field: function, inside: { kind: decorator } }
    # `pytest.mark` itself bound to a name, which reaches the markers unspelled.
    - kind: attribute
      regex: '^pytest\.mark$'
      not: { inside: { kind: attribute, field: object } }
    - kind: import_from_statement
      all:
        - has: { field: module_name, regex: '^pytest$' }
        - has: { kind: dotted_name, regex: '^(skip|mark)$', stopBy: end }
    - kind: import_from_statement
      has: { field: module_name, regex: '^_pytest(\.|$)' }
    - kind: import_statement
      has: { kind: dotted_name, regex: '^_pytest(\.|$)', stopBy: end }
    - kind: aliased_import
      has: { field: name, regex: '^pytest$' }
