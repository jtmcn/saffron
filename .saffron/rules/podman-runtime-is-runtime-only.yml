id: podman-runtime-is-runtime-only
language: python
severity: error
message: only saffron/cell/runtimes/podman.py may build a `podman` argv
note: |
  DESIGN.md Appendix G. One module per runtime names its own product, and
  `saffron/cell/runtime.py` — which every caller uses — names none, so adding a
  second runtime is a new file beside this rule's exemption rather than an edit
  spread through the tree. `runtime.py` exports `RUNTIME` and reaches the rest
  through a `Dialect`; call through those rather than spelling the binary here.

  This is that second copy. It is a near-duplicate of
  `container-runtime-is-runtime-only.yml` on purpose: one rule cannot serve both
  runtimes, because the binary is a different word and each exemption is
  asserted by value in `tests/test_saffron_gates.py` so that widening either is
  a decision somebody made (backlog items 102, 103).

# `tests/**` and `.saffron/**` are out of scope, and by naming the two trees the
# invariant is about rather than by exemption: Appendix G governs what `saffron/`
# ships, and a test that starts a real cell to probe it must spell the binary.
# Said here because the other rule states its `tests/**` exemption outright, and
# a scope that excludes something as a side effect reads like an oversight.
files:
  - "saffron/**/*.py"
  - "images/**/*.py"
ignores:
  - "saffron/cell/runtimes/podman.py"

# The binary as code, not the bare word: this runtime is discussed by name in
# comments and docstrings, and a text search cannot tell those from a call.
# This is why the rule is structural.
# ponytail: a name the parser never reads is out of reach — `"pod" + "man"`
# and `subprocess.run("container run", shell=True)` both walk past. The ceiling
# is deliberate evasion; the branches below are the forms a refactor reaches for.
utils:
  # The binary as a string literal, matched on the string's *content* rather than
  # on its source text. A `string` node's text carries its quotes and its prefix,
  # so a regex anchored on `['"]` reads only the spellings its author typed:
  # measured, `r"podman"` walked past all six branches at once while `lint`
  # and `format` both passed it, since ruff has no rule against a raw string and
  # the formatter does not rewrite one. `string_content` carries neither, so the
  # quote style, the `r`/`f`/`b` prefix and the triple-quoted form are all one
  # case. The optional prefix is the binary spelled as a path.
  # ponytail: an escape splits the content into several nodes, so `"podma\x6e"`
  # is out of reach — the same evasion ceiling the note above states.
  binary-literal:
    kind: string
    has: { kind: string_content, regex: '^(.*/)?podman$' }
rule:
  any:
    # subprocess.run(["podman", "run", ...]). Any element, not just the first:
    # measured, `nthChild: 1` let every argv that prefixes the binary walk past —
    # `["sudo", "podman", "run"]`, and the same with `env` or a wrapper.
    # `has:` reaches direct children only, which is what keeps the labelled
    # a labelled tuple out: such a list's child is a tuple, not a string. The
    # sibling rule carries a real instance of that at `session.py`; this binary
    # has none, and the branch is kept so that adding one is not a hole.
    - kind: list
      has: { matches: binary-literal }
    # subprocess.run(("podman", "run")) — a tuple is an argv too. Guarded on
    # not being an element of a list, because `session.py:1797` holds
    # a labelled tuple, which is data rather than a call — the shape the
    # sibling rule guards. Measured: 0 matches in scope for this binary.
    - kind: tuple
      all:
        - has: { matches: binary-literal }
        - not: { inside: { kind: list } }
    # RT = "container" — the indirection this rule's own note invites. Without
    # it, naming the binary once and calling through the local satisfies every
    # branch above while doing what Appendix G forbids. Measured: the one match
    # in scope is `RUNTIME` in the file already exempted.
    - kind: assignment
      has: { field: right, matches: binary-literal }
    # `RT += "podman"` — a distinct node kind from `assignment`, which is the
    # same argument this rule already makes for `keyword_argument` and
    # `default_parameter` below. Measured: 0 matches in scope.
    - kind: augmented_assignment
      has: { field: right, matches: binary-literal }
    # The three other places a name binds to the binary, which the assignment
    # branch above does not reach because none of them is an assignment:
    # `start(runtime="podman")`, `def start(binary="podman")` and
    # `RUNTIMES = {"linux": "podman"}`. `session.py` calls its helpers by
    # keyword throughout, so the first is the form a refactor reaches for.
    # Measured: 0 matches in scope for all three. The *key* stays free — the
    # tree has `{"container": ...}` as a label, which is a mention, not an argv.
    - kind: keyword_argument
      has: { field: value, matches: binary-literal }
    - kind: default_parameter
      has: { field: value, matches: binary-literal }
    - kind: pair
      has: { field: value, matches: binary-literal }
    # `return "container"` and `shutil.which("podman")` — the function form of
    # the `RT = "podman"` indirection, and the binary as a plain call argument.
    # `which` is what a preflight check reaches for, and a helper returning the
    # name satisfies every branch above. Measured: 0 matches in scope.
    - kind: return_statement
      has: { matches: binary-literal }
    - kind: argument_list
      has: { matches: binary-literal }
    # `BINS = {"podman"}` — a set literal is neither a list nor a tuple, and
    # its elements are direct children with no `field:` to name. Measured: 0.
    - kind: set
      has: { matches: binary-literal }
