[project]
name = "saffron"
version = "0.0.0"
description = "Turns specs into reviewable pull requests"
requires-python = ">=3.12"
# No claude-agent-sdk: the host is architecturally forbidden to import it
# (§2.1), and images/cell-base.python.Dockerfile installs it where it is used.
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
saffron = "saffron.cli:main"

[dependency-groups]
# ruff is declared, not assumed: the `format` and `lint` gates run it inside a
# cell, where a globally-installed host binary does not exist.
# pyoxigraph and pyshacl are test-only: SA-0001 validates the ontology, and
# nothing under saffron/ imports either (the emitter is a later, conditional task).
dev = ["pytest>=8", "ruff>=0.16.3", "pyoxigraph>=0.4", "pyshacl>=0.26", "rdflib>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saffron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cell: needs a real cell runtime; excluded from the default run"]
addopts = "-m 'not cell'"

[tool.pyright]
# Wire pyright to the project venv: by default it resolves the pyenv global
# interpreter (no pydantic/pytest), so every import failed and types degraded
# to Unknown. `venvPath` is the dir containing the venv, `venv` its name.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# basic is the pyright default: reportArgType etc, but not the strict-only rules
# (e.g. reportUnknownMemberType). Raise per-rule below instead of strict mode.
typeCheckingMode = "basic"
# docs are a record (ruff excludes them too); spikes are throwaway; .saffron is
# this repo being its own target. `.venv` is excluded from *analysis* (type-
# checking the installed packages is pure noise) but the venvPath/venv pair above
# still resolves imports against it.
exclude = ["docs", "spikes", ".saffron", ".venv"]

[tool.ruff]
# ruff formats python blocks inside markdown; plan docs are a record, leave them.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E501 is the formatter's job; what it can't wrap is long strings.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
