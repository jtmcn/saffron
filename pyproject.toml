[project]
name = "saffron"
version = "0.0.0"
description = "Turns specs into reviewable pull requests"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.142",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
saffron = "saffron.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saffron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cell: needs a real cell runtime; excluded from the default run"]
addopts = "-m 'not cell'"

[tool.ruff]
# ruff formats python blocks inside markdown; plan docs are a record, leave them.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E501 is the formatter's job; what it can't wrap is long strings.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
