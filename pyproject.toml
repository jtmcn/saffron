[project]
name = "saffron"
version = "0.0.0"
description = "Turns specs into reviewable pull requests"
requires-python = ">=3.12"
# No claude-agent-sdk: the host is architecturally forbidden to import it
# (§2.1), and images/cell-base.python.Dockerfile installs it where it is used.
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
saffron = "saffron.cli:main"

[dependency-groups]
# ruff is declared, not assumed: the `format` and `lint` gates run it inside a
# cell, where a globally-installed host binary does not exist.
# pyoxigraph and pyshacl are test-only: SA-0001 validates the ontology, and
# nothing under saffron/ imports either (the emitter is a later, conditional task).
# ty is pinned exactly, not floored: the `types` gate parses its `concise`
# output (ty emits no JSON), and it is pre-1.0 — a format change on a routine
# resolve would turn a batch red overnight rather than at review.
dev = [
    "pytest>=8",
    "ruff>=0.16.3",
    "ty==0.0.77",
    "pyoxigraph>=0.4",
    "pyshacl>=0.26",
    "rdflib>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saffron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cell: needs a real cell runtime; excluded from the default run"]
addopts = "-m 'not cell'"

[tool.ty]
# Everything is in scope, docs included. `docs/` is excluded from ruff as a
# record of past spikes, but a spike script that no longer type-checks is a
# record of something that no longer runs.
[tool.ty.environment]
python = ".venv"
python-version = "3.12"

# The host is architecturally forbidden to import the Agent SDK (§2.1); the cell
# image installs it where it is used. Declared here rather than as an inline
# ignore because `# type: ignore` is a suppression `integrity` fails on, and
# because this is an architectural fact, not a local nuisance.
[[tool.ty.overrides]]
include = ["images/agent_runner.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.ruff]
# ruff formats python blocks inside markdown; plan docs and spec files are
# records, leave them. `.saffron/gates/*.py` is real code and stays in scope.
extend-exclude = ["docs", ".saffron/specs"]

[tool.ruff.lint]
# E501 is the formatter's job; what it can't wrap is long strings.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
