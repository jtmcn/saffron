[project]
name = "saffron"
version = "0.0.0"
description = "Turns specs into reviewable pull requests"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml"]

[project.scripts]
saffron = "saffron.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saffron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
