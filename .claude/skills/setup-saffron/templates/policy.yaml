# What Saffron reads from this repo. Drop a gate with no analogue here.
gates:
  format:     { blocking: true }
  lint:       { blocking: true }
  types:      { blocking: true }
  tests:      { blocking: true }
  no-network: { blocking: true }
  # Advisory at every tier: its cheapest satisfaction is a test that asserts nothing.
  coverage:   { blocking: false }
  # FILL: the domain gate, what is expensive to fake here.

# FILL: where a plausible-looking wrong change hurts most.
elevate_on: []

# FILL: files no task edits, such as a lockfile.
protected:
  - .saffron/**

integrity:
  # FILL: where the tests live.
  test_paths: []
  # FILL: each language's skip, expected-failure and ignore-comment tokens.
  suppressions: []
  # FILL: every file that changes what a gate measures, such as each tool's config.
  gate_config:
    - .saffron/**
    - "**/.gitignore"

witness:
  # FILL: a Python `re` searched in a witness id. Its `name` group is the test's name.
  witness_name: null
  # FILL: a pattern holding `{name}` that matches that test's own text.
  witness_body: null
  # FILL: a `pattern` per constant spelling, with `name` and the `value` a constant mutant edits.
  # Each `replace` must leave every matched file importable.
  constants: []

# FILL: caps for a thread pool sized from the CPU count.
thread_env: {}
